name: Git Orbit
description: Grow an animated orbital relay from a repository's Git history.
inputs:
  output-dir:
    description: Output directory, relative to the checked-out repository.
    default: output
  style:
    description: Visual style, terminal or pixel.
    default: terminal
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install renderer
      shell: bash
      env:
        ORBIT_ACTION_PATH: ${{ github.action_path }}
      run: python -m pip install -r "$ORBIT_ACTION_PATH/requirements.txt"
    - name: Grow station
      shell: bash
      env:
        ORBIT_ACTION_PATH: ${{ github.action_path }}
        ORBIT_OUTPUT_DIR: ${{ inputs.output-dir }}
        ORBIT_STYLE: ${{ inputs.style }}
      run: python "$ORBIT_ACTION_PATH/orbit.py" --repo "$GITHUB_WORKSPACE" --output "$GITHUB_WORKSPACE/$ORBIT_OUTPUT_DIR" --style "$ORBIT_STYLE"
