name: Grow my constellation

on:
  push:
    branches: [master]
    paths:
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'action.yml'
      - '.github/workflows/orbit.yml'
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: git-orbit-${{ github.ref }}
  cancel-in-progress: false

jobs:
  orbit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: ./
        with:
          username: ${{ github.repository_owner }}
          output-dir: output
      - name: Commit the constellation and its earned progress
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- output/orbit.svg output/orbit-static.svg output/.orbit-state
          if ! git diff --cached --quiet; then
            git commit -m 'chore: grow my constellation'
            git push
          fi
